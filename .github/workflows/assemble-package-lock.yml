name: Assemble package-lock

on:
  push:
    branches:
      - cursor/photos-caption-qa-868d

permissions:
  contents: write

jobs:
  assemble:
    if: contains(github.event.head_commit.message, 'Prepare package-lock.json patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and commit lockfile
        run: |
          set -euo pipefail
          base64 -d .github/package-lock.json.patch.b64 | git apply
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          data = Path("package-lock.json").read_bytes()
          expect = "5c44e78e7158244e8347dffc6501a447648aaa2150d05588c8822f2acbc23600"
          got = hashlib.sha256(data).hexdigest()
          if got != expect:
              raise SystemExit(f"sha256 mismatch: {got}")
          print("package-lock.json sha256 ok", got, "bytes", len(data))
          PY2
          rm -f .github/package-lock.json.patch.b64
          rm -f .github/workflows/assemble-package-lock.yml
          git config user.name "enzo"
          git config user.email "enzo@design-prism.com"
          git add -A
          git commit -m "Lock @vercel/functions in package-lock.json"
          git push
