name: News polish mutants

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: News polish mutants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news-polish mutant suite
        run: npm run check:events-mutants
